name: TechPros
options:
  bundleIdPrefix: com.techpros
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  TechPros:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TechPros
        excludes:
          - Resources/Assets.xcassets
    resources:
      - path: TechPros/Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
    info:
      path: TechPros/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tech Pros
        CFBundleIdentifier: com.techpros.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSCameraUsageDescription: "Tech Pros needs camera access to capture equipment photos for troubleshooting."
        NSPhotoLibraryUsageDescription: "Tech Pros needs photo library access to upload equipment photos for troubleshooting."
        NSMicrophoneUsageDescription: "Tech Pros needs microphone access for voice input so you can ask questions hands-free."
        NSSpeechRecognitionUsageDescription: "Tech Pros uses speech recognition so you can ask questions hands-free while on the job."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.techpros.app
      SWIFT_VERSION: "5.9"
      DEVELOPMENT_TEAM: CX6M8MBXJ9
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: TechPros/Resources/Info.plist
      ENABLE_PREVIEWS: YES
